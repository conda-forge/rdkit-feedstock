{% set version = "2026_09_1" %}
{% set filename = "Release_%s.tar.gz" % version.replace(".", "_") %}
{% set version = version.replace("_",".") %} # workaround bad conda-forge/rdkit release name interaction


package:
  # NOTE(skearnes): Using `rdkit` as the package name conflicts with the `rdkit` subpackage and causes problems; see
  # https://docs.conda.io/projects/conda-build/en/latest/resources/define-metadata.html#outputs-section and
  # https://docs.conda.io/projects/conda-build/en/latest/resources/define-metadata.html#implicit-metapackages.
  name: rdkit-meta
  version: {{ version }}

source:
  fn: {{ filename }}
  url: https://github.com/rdkit/rdkit/archive/{{ filename }}
  sha256: 86711e340759a3a0678a2e62f54f26f7ff564c3a02de0460f60b1ce89ac1bfe9

  patches:
    - pg_regress.patch
    - CMakeLists.txt.patch
    - pyproject.patch
    # These two backport rdkit/rdkit#9669, which Windows DLL builds of the wrappers
    # need; drop both once a release includes it.
    - SubstructDetails.patch
    # Keeps NOGIL out of the RDBoost DLL interface, which nanobind builds lack.
    - nanobind-windows.patch
    # Together these keep librdkit and librdkit-dev identical across wrapper flavors;
    # drop both once rdkit/rdkit#9621 ships in a release.
    # Installs Python-coupled files into the python component.
    - python-component.patch
    # Sets RDKit_HAS_PYTHON_WRAPPERS from whether rdkitpython is installed instead of
    # from the build option, which would leave librdkit-dev's value to whichever
    # flavor uploads first.
    - rdkit-config.patch

build:
  number: 1

requirements:
  # See https://conda-forge.org/docs/maintainer/knowledge_base/#placing-requirements-in-build-or-host and
  # https://conda-forge.org/docs/maintainer/knowledge_base/#details-about-cross-compiled-python-packages.
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - numpy                               # [build_platform != target_platform]
    - postgresql                          # [build_platform != target_platform]
    - python                              # [build_platform != target_platform]
    - nanobind 2.*                        # [build_platform != target_platform and wrapper_flavor == "nanobind"]
    - cmake
    - jom   # [win]
    - make  # [unix]
    - pkg-config
  host:
    - cairo
    - eigen
    - freetype
    - expat
    - libboost-devel
    - libboost-python-devel  # [wrapper_flavor == "boost"]
    # RDKit asks for `find_package(nanobind 2 CONFIG)`, and nanobind's config accepts
    # only its own major version.
    - nanobind 2.*           # [wrapper_flavor == "nanobind"]
    - numpy
    - pandas
    - pillow
    - pip
    - postgresql
    - python
    - setuptools
    - setuptools_scm >=8

outputs:
  - name: librdkit
    script: install.sh  # [unix]
    script: install.bat  # [win]
    build:
      run_exports:
        - {{ pin_subpackage('librdkit', exact=True) }}
    requirements:
      build:
        - {{ compiler("cxx") }}
        - {{ stdlib("c") }}
        - cmake
      host:
        - cairo
        - freetype
        - expat
        - libboost-devel
        - eigen-abi-devel
    test:
      commands:
        - test -f $PREFIX/lib/libRDKitGraphMol.so              # [linux]
        - test -f $PREFIX/lib/libRDKitGraphMol.dylib           # [osx]
        - if not exist %LIBRARY_BIN%\RDKitGraphMol.dll exit 1  # [win]
        # Dev-only artifacts should live in librdkit-dev, not here.
        - test ! -e $PREFIX/lib/cmake/rdkit/rdkit-config.cmake  # [unix]
        - test ! -e $PREFIX/include/rdkit/RDGeneral/hash/hash.hpp  # [unix]
        - if exist %LIBRARY_LIB%\cmake\rdkit\rdkit-config.cmake exit 1  # [win]
        - if exist %LIBRARY_INC%\rdkit\RDGeneral\hash\hash.hpp exit 1  # [win]
        # Every wrapper flavor builds librdkit under one build string, so nothing
        # flavor-specific may land here.
        - test ! -e $PREFIX/share/RDKit/Scripts  # [unix]
        - test ! -e $PREFIX/lib/libnanobind.so  # [linux]
        - test ! -e $PREFIX/lib/libnanobind.dylib  # [osx]
        - if exist %LIBRARY_PREFIX%\share\RDKit\Scripts exit 1  # [win]
        - if exist %LIBRARY_BIN%\nanobind.dll exit 1  # [win]
    about:
      summary: RDKit C++ library
      license: BSD-3-Clause
      license_file: license.txt

  - name: librdkit-dev
    script: install.sh  # [unix]
    script: install.bat  # [win]
    build:
      run_exports:
        - {{ pin_compatible('eigen-abi', max_pin='x.x.x.x') }}
    requirements:
      build:
        - {{ stdlib("c") }}
        - cmake
      host:
        - eigen-abi-devel
      run:
        - {{ pin_subpackage('librdkit', exact=True) }}
        - eigen-abi-devel
    test:
      commands:
        - test -f $PREFIX/include/rdkit/GraphMol/GraphMol.h               # [unix]
        - if not exist %LIBRARY_INC%\\rdkit\\GraphMol\\GraphMol.h exit 1  # [win]
        # Cmake config and hash headers must live here, not in librdkit.
        - test -f $PREFIX/lib/cmake/rdkit/rdkit-config.cmake  # [unix]
        - test -f $PREFIX/include/rdkit/RDGeneral/hash/hash.hpp  # [unix]
        - if not exist %LIBRARY_LIB%\\cmake\\rdkit\\rdkit-config.cmake exit 1  # [win]
        - if not exist %LIBRARY_INC%\\rdkit\\RDGeneral\\hash\\hash.hpp exit 1  # [win]
        # Python-coupled cmake config must live in the rdkit (python) output, not here.
        - test ! -e $PREFIX/lib/cmake/rdkitpython/rdkitpython-config.cmake  # [unix]
        - if exist %LIBRARY_LIB%\\cmake\\rdkitpython\\rdkitpython-config.cmake exit 1  # [win]
        # The wrapper headers differ by flavor, so they belong to the rdkit output.
        # Windows copies every source header and so ships the same set for each flavor.
        - test ! -e $PREFIX/include/rdkit/RDBoost  # [unix]
        # A build option baked into the cmake config would differ by flavor.
        - test "$(grep -cE '^set\(RDKit_HAS_PYTHON_WRAPPERS (ON|OFF)\)' $PREFIX/lib/cmake/rdkit/rdkit-config.cmake)" = 0  # [unix]
    about:
      summary: RDKit headers and library used in librdkit
      license: BSD-3-Clause
      license_file: license.txt

  - name: rdkit
    script: install.sh  # [unix]
    script: install.bat  # [win]
    build:
      # Downstreams pin a flavor with `rdkit {{ version }} boost_*`; see
      # conda_build_config.yaml.
      string: {{ wrapper_flavor }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
      # Keeps boost the default when nothing selects a flavor.
      track_features:  # [wrapper_flavor == "nanobind"]
        - rdkit_nanobind  # [wrapper_flavor == "nanobind"]
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cross-python_{{ target_platform }}  # [build_platform != target_platform]
        - numpy                               # [build_platform != target_platform]
        - python                              # [build_platform != target_platform]
        - cmake
        - jom   # [win]
        - make  # [unix]
        - pkg-config
      host:
        - {{ pin_subpackage('librdkit', exact=True) }}
        - cairo
        - eigen
        - freetype
        - expat
        - libboost-devel
        - libboost-python-devel  # [wrapper_flavor == "boost"]
        - nanobind 2.*           # [wrapper_flavor == "nanobind"]
        - matplotlib-base
        - numpy
        - pandas
        - pillow
        - pip
        - postgresql
        - pybind11-stubgen  # [wrapper_flavor == "boost"]
        - pycairo
        - python
        - reportlab
        - setuptools
        - setuptools_scm >=8
        - sqlalchemy
      run:
        - {{ pin_subpackage('librdkit', exact=True) }}
        - matplotlib-base
        - numpy
        - pandas
        - pillow
        - pycairo
        - python
        - reportlab
        - sqlalchemy
    test:
      commands:
        - python -c "import rdkit; assert rdkit.__version__ == '{{ version }}'"
        # Test the availability of Contrib.
        - python -c "import os; import sys; sys.path.append(os.path.join(os.environ['CONDA_PREFIX'], 'share', 'RDKit', 'Contrib')); from SA_Score import sascorer"  # [unix]
        - python -c "import os; import sys; sys.path.append(os.path.join(os.environ['CONDA_PREFIX'], 'Library', 'share', 'RDKit', 'Contrib')); from SA_Score import sascorer"  # [win]
        # Python-coupled cmake config must live here, not in librdkit-dev. Upstream
        # exports it only for Boost.Python.
        - test -f $PREFIX/lib/cmake/rdkitpython/rdkitpython-config.cmake  # [unix and wrapper_flavor == "boost"]
        - if not exist %LIBRARY_LIB%\\cmake\\rdkitpython\\rdkitpython-config.cmake exit 1  # [win and wrapper_flavor == "boost"]
        # The wrappers must match the flavor in the build string.
        - test -f $PREFIX/lib/libRDKitRDBoost.so  # [linux and wrapper_flavor == "boost"]
        - test -f $PREFIX/lib/libRDKitRDBoost.dylib  # [osx and wrapper_flavor == "boost"]
        - if not exist %LIBRARY_BIN%\\RDKitRDBoost.dll exit 1  # [win and wrapper_flavor == "boost"]
        - test ! -e $PREFIX/lib/libnanobind.so  # [linux and wrapper_flavor == "boost"]
        - test ! -e $PREFIX/lib/libnanobind.dylib  # [osx and wrapper_flavor == "boost"]
        - if exist %LIBRARY_BIN%\\nanobind.dll exit 1  # [win and wrapper_flavor == "boost"]
        - test -f $PREFIX/lib/libnanobind.so  # [linux and wrapper_flavor == "nanobind"]
        - test -f $PREFIX/lib/libnanobind.dylib  # [osx and wrapper_flavor == "nanobind"]
        - if not exist %LIBRARY_BIN%\\nanobind.dll exit 1  # [win and wrapper_flavor == "nanobind"]
        - test ! -e $PREFIX/lib/libRDKitRDBoost.so  # [linux and wrapper_flavor == "nanobind"]
        - test ! -e $PREFIX/lib/libRDKitRDBoost.dylib  # [osx and wrapper_flavor == "nanobind"]
        - if exist %LIBRARY_BIN%\\RDKitRDBoost.dll exit 1  # [win and wrapper_flavor == "nanobind"]
      imports:
        - rdkit
        - rdkit.Avalon
        - rdkit.Chem
        - rdkit.Chem.AllChem
        - rdkit.Chem.rdFreeSASA
        - rdkit.DataManip
        - rdkit.Dbase
        - rdkit.DistanceGeometry
        - rdkit.ForceField
        - rdkit.Geometry
        - rdkit.ML
        - rdkit.Numerics
        - rdkit.SimDivFilters
        - rdkit.VLib
        - rdkit.VLib.NodeLib
        - rdkit.Chem.PandasTools
    about:
      summary: RDKit Python bindings
      license: BSD-3-Clause
      license_file: license.txt

  - name: rdkit-boost
    build:
      string: {{ wrapper_flavor }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
      # Only the boost variant may claim this name; another flavor's build would
      # otherwise publish an rdkit-boost that resolves to the wrong wrappers.
      skip: true  # [wrapper_flavor != "boost"]
    requirements:
      run:
        - {{ pin_subpackage('rdkit', exact=True) }}
    test:
      imports:
        - rdkit.Chem
    about:
      summary: Selects the Boost.Python build of the RDKit Python bindings
      license: BSD-3-Clause
      license_file: license.txt

  - name: rdkit-nanobind
    build:
      string: {{ wrapper_flavor }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
      skip: true  # [wrapper_flavor != "nanobind"]
    requirements:
      run:
        - {{ pin_subpackage('rdkit', exact=True) }}
    test:
      imports:
        - rdkit.Chem
    about:
      summary: Selects the nanobind build of the RDKit Python bindings
      license: BSD-3-Clause
      license_file: license.txt

  - name: rdkit-dev
    build:
      # Pins one flavor and Python of rdkit exactly, so both go in the build string to
      # keep one package per combination.
      string: {{ wrapper_flavor }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
    requirements:
      run:
        - {{ pin_subpackage('librdkit-dev', exact=True) }}
        - {{ pin_subpackage('rdkit', exact=True) }}
    test:
      commands:
        - test -f $PREFIX/include/rdkit/GraphMol/GraphMol.h               # [unix]
        - if not exist %LIBRARY_INC%\\rdkit\\GraphMol\\GraphMol.h exit 1  # [win]
        - python -c "import rdkit; assert rdkit.__version__ == '{{ version }}'"
      imports:
        - rdkit
        - rdkit.Avalon
        - rdkit.Chem
        - rdkit.Chem.AllChem
        - rdkit.Chem.rdFreeSASA
        - rdkit.DataManip
        - rdkit.Dbase
        - rdkit.DistanceGeometry
        - rdkit.ForceField
        - rdkit.Geometry
        - rdkit.ML
        - rdkit.Numerics
        - rdkit.SimDivFilters
        - rdkit.VLib
        - rdkit.VLib.NodeLib
        - rdkit.Chem.PandasTools
    about:
      summary: Alias package for librdkit-dev + rdkit
      license: BSD-3-Clause
      license_file: license.txt

  - name: rdkit-postgresql
    build:
      skip: true  # [aarch64 or ppc64le]
    script: install.sh  # [unix]
    script: install.bat  # [win]
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib("c") }}
        - postgresql  # [build_platform != target_platform]
        - cmake
      host:
        - {{ pin_subpackage('librdkit', exact=True) }}
        - cairo
        - freetype
        - expat
        - libboost-devel
        - postgresql
      run:
        - {{ pin_subpackage('librdkit', exact=True) }}
        - postgresql
    test:
      commands:
        # Inspired by https://github.com/conda-forge/pgvector-feedstock/blob/main/recipe/bld.bat.
        - initdb -D test_db
        - if errorlevel 1 exit 1                           # [win]
        - pg_ctl -D test_db -l test.log start
        - if errorlevel 1 exit 1                           # [win]
        - createuser --username=%USERNAME% -w -s postgres  # [win]
        - if errorlevel 1 exit 1                           # [win]
        - createdb test
        - if errorlevel 1 exit 1                           # [win]
        - psql -c "CREATE EXTENSION rdkit" test
        - if errorlevel 1 exit 1                           # [win]
        - pg_ctl -D test_db stop
    about:
      summary: RDKit PostgreSQL cartridge
      license: BSD-3-Clause
      license_file: license.txt

about:
  home: http://rdkit.org
  license: BSD-3-Clause
  license_file: license.txt
  summary: RDKit is a collection of cheminformatics and machine-learning software written in C++ and Python.
  doc_url: http://www.rdkit.org/docs/index.html
  dev_url: https://github.com/rdkit/rdkit

extra:
  feedstock-name: rdkit
  recipe-maintainers:
    - greglandrum
    - pstjohn
    - mcs07
    - jaimergp
    - skearnes
